services:

  postgres:
    image: postgres:17
    container_name: infrapilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: infrapilot_ai
      POSTGRES_USER: adebanke
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adebanke -d infrapilot_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  ollama:
    image: ollama/ollama:latest
    container_name: infrapilot-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  ollama-init:
    image: ollama/ollama:latest
    container_name: infrapilot-ollama-init

    depends_on:
      ollama:
        condition: service_healthy

    entrypoint: >
      sh -c "OLLAMA_HOST=ollama:11434 ollama pull llama3.2:3b"

    restart: "no"


  backend:
    build:
      context: .

    container_name: infrapilot-backend
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/app/data/chroma_db
      - storage_data:/app/storage
      - huggingface_cache:/app/.cache/huggingface

    environment:
      HF_HOME: /app/.cache/huggingface
      OLLAMA_BASE_URL: http://ollama:11434


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: infrapilot-frontend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      BACKEND_BASE_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_started

    ports:
      - "8501:8501"


volumes:
  postgres_data:
  chroma_data:
  storage_data:
  huggingface_cache:
  ollama_data: